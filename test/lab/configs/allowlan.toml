# Like base, with allow_lan on the tunnel (LAN stays reachable for tunnelled apps).
[daemon]
default_route = "tunnel:intern"

[tunnel.intern]
config = "tunnels/intern.conf"
allow_lan = true

[[rule]]
name = "lab: tunnel"
app = ["labtun", "labtun-dig", "labtun-nc", "labtun-sh"]
route = "tunnel:intern"

[[rule]]
name = "lab: direct"
app = ["labdir", "labdir-dig", "labdir-nc"]
route = "direct"
