# Lab: like defense.toml, but the active DNS check is off (Q03: the analyzer must not see its queries).
[daemon]
socket_group = "shunt"
default_route = "tunnel:intern"

[tunnel.intern]
config = "tunnels/intern.conf"

[[rule]]
name = "lab: tunnel"
app = ["labtun", "labtun-dig", "labtun-nc", "labtun-sh"]
route = "tunnel:intern"

[[rule]]
name = "lab: direct"
app = ["labdir", "labdir-dig", "labdir-nc"]
route = "direct"

[inbound]
enabled = true

[defense]
enabled = true
decoy_ports = [23, 80, 445, 2222, 2323, 3389]
ban_seconds = 300
dhcp_probe = "on"
dns_probe = "off"

[defense.features.decoy]
watch = true
[defense.features.scan]
watch = true
block = true
[defense.features.brute]
watch = true
block = true
[defense.features.arp]
watch = true
[defense.features.dhcp]
watch = true
[defense.features.dns]
watch = true
