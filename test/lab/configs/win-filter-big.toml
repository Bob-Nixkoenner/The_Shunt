# Windows lab: DNS filter with a big synthetic local list (W03: memory of the sorted hash table; three files, one list is cut at 64 MB).
[daemon]
mac = ""
dhcp_hostname = ""
default_route = "tunnel:intern"

[tunnel.intern]
config = "tunnels/intern.conf"

[[rule]]
name = "lab: tunnel"
app = ["labtun", "labtun-dig", "labtun-nc", "labtun-sh"]
route = "tunnel:intern"

[[rule]]
name = "lab: direct"
app = ["labdir", "labdir-dig", "labdir-nc"]
route = "direct"

[dns_filter]
default = "normal"
low = []
normal = ['file:C:\ProgramData\Shunt\big-filter1.txt', 'file:C:\ProgramData\Shunt\big-filter2.txt', 'file:C:\ProgramData\Shunt\big-filter3.txt']
paranoid = []
