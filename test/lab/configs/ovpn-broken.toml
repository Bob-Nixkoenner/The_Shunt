# O05: OpenVPN tunnels that never come up (dead endpoint; client without the server's tls-crypt key)
[daemon]
socket_group = "shunt"
default_route = "tunnel:intern"

[tunnel.intern]
driver = "openvpn"
config = "tunnels/intern.ovpn"

[tunnel.dead]
driver = "openvpn"
config = "tunnels/dead.ovpn"

[tunnel.notc]
driver = "openvpn"
config = "tunnels/notc.ovpn"

[[rule]]
name = "lab: tunnel"
app = ["labtun", "labtun-dig", "labtun-nc", "labtun-sh"]
route = "tunnel:dead"

[[rule]]
name = "lab: no tls-crypt"
app = ["labtog"]
route = "tunnel:notc"

[[rule]]
name = "lab: direct"
app = ["labdir", "labdir-dig", "labdir-nc"]
route = "direct"
