# O02: the tunnel "intern" as OpenVPN over TCP 443 (for networks that only let 80/443 through)
[daemon]
socket_group = "shunt"
default_route = "tunnel:intern"

[tunnel.intern]
driver = "openvpn"
config = "tunnels/intern-tcp.ovpn"

[[rule]]
name = "lab: tunnel"
app = ["labtun", "labtun-dig", "labtun-nc", "labtun-sh"]
route = "tunnel:intern"

[[rule]]
name = "lab: direct"
app = ["labdir", "labdir-dig", "labdir-nc"]
route = "direct"
