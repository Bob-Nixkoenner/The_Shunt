# Lab: the default lists (HaGeZi etc.) are downloaded; they must go through the tunnel.
# Lab client base config: one tunnel to the internal test server (CT130),
# the lab apps pinned to it / to direct, everything else through the tunnel.
[daemon]
socket_group = "shunt"
default_route = "tunnel:intern"

[tunnel.intern]
config = "tunnels/intern.conf"

[[rule]]
name = "lab: tunnel"
app = ["labtun", "labtun-dig", "labtun-nc", "labtun-sh"]
route = "tunnel:intern"

[[rule]]
name = "lab: direct"
app = ["labdir", "labdir-dig", "labdir-nc"]
route = "direct"

[dns_filter]
default = "normal"
