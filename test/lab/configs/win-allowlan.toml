# Like base, with allow_lan on the tunnel (LAN stays reachable for tunnelled apps).
[daemon]
# Lab: ohne Tarnung (mac/dhcp_hostname leer = unveraendert), sonst aendert sich die MAC beim Dienststart
mac = ""
dhcp_hostname = ""
default_route = "tunnel:intern"

[tunnel.intern]
config = "tunnels/intern.conf"
allow_lan = true

[[rule]]
name = "lab: tunnel"
app = ["labtun", "labtun-dig", "labtun-nc", "labtun-sh"]
route = "tunnel:intern"

[[rule]]
name = "lab: direct"
app = ["labdir", "labdir-dig", "labdir-nc"]
route = "direct"

# Lab: no blocklists (see win-base.toml)
[dns_filter]
default = "off"
low = []
normal = []
paranoid = []
