# Lab client: OpenVPN inside WireGuard. The outer tunnel "intern" is WireGuard (wgt0); the
# hop is the OpenVPN server of CT130 reached at 10.66.0.1:1194 through it (hop.ovpn from
# OVPN_HOP_CONF). Capture on CT130: CT130_IF=tun0 TUNNEL_IP=<client address on 10.67.0.0/24>.
[daemon]
socket_group = "shunt"
default_route = "tunnel:intern"

[tunnel.intern]
config = "tunnels/intern.conf"

[tunnel.hop]
driver = "openvpn"
config = "tunnels/hop.ovpn"
via = "tunnel:intern"

[[rule]]
name = "lab: tunnel"
app = ["labtun", "labtun-dig", "labtun-nc", "labtun-sh"]
route = "tunnel:hop"

[[rule]]
name = "lab: direct"
app = ["labdir", "labdir-dig", "labdir-nc"]
route = "direct"
