# Windows lab: base plus a [defense] section (X02: the Windows service has no defense; the config must still load and nothing may break)
# Lab client base config: one tunnel to the internal test server (CT130),
# the lab apps pinned to it / to direct, everything else through the tunnel.
[daemon]
# Lab: ohne Tarnung (mac/dhcp_hostname leer = unveraendert), sonst aendert sich die MAC beim Dienststart
mac = ""
dhcp_hostname = ""
default_route = "tunnel:intern"

[tunnel.intern]
config = "tunnels/intern.conf"

[[rule]]
name = "lab: tunnel"
app = ["labtun", "labtun-dig", "labtun-nc", "labtun-sh"]
route = "tunnel:intern"

[[rule]]
name = "lab: direct"
app = ["labdir", "labdir-dig", "labdir-nc"]
route = "direct"

[defense]
enabled = true
decoy_ports = [23, 80, 445, 2222, 2323, 3389]
ban_seconds = 300
dhcp_probe = "on"
dns_probe = "on"

[defense.features.decoy]
watch = true
[defense.features.scan]
watch = true
block = true
[defense.features.brute]
watch = true
block = true
[defense.features.arp]
watch = true
