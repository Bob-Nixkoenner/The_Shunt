# M04: a tunnel that never comes up (wrong endpoint) and one with a wrong key
[daemon]
socket_group = "shunt"
default_route = "tunnel:intern"

[tunnel.intern]
config = "tunnels/intern.conf"

[tunnel.dead]
config = "tunnels/dead.conf"

[tunnel.badkey]
config = "tunnels/badkey.conf"

[[rule]]
name = "lab: tunnel"
app = ["labtun", "labtun-dig", "labtun-nc", "labtun-sh"]
route = "tunnel:dead"

[[rule]]
name = "lab: badkey"
app = ["labtog"]
route = "tunnel:badkey"

[[rule]]
name = "lab: direct"
app = ["labdir", "labdir-dig", "labdir-nc"]
route = "direct"
