# Default DNS filter lists of The Shunt.
#
# This file is the single source of truth: it is compiled into the programs
# (go:embed) and rendered as docs/DNS-LISTS.md (run: go test ./dnslists -update).
# Want something added, moved or removed? Edit this file and open a pull
# request - or open an issue. Forks only need to change this file.
#
# Levels build on each other: 2 (normal) = 1 + its own lists, 3 (paranoid) =
# 1 + 2 + its own lists. Lists come from RPiList/specials unless "url" is set.

# Level used for everything without its own level: 1 = low, 2 = normal,
# 3 = paranoid. 0 would turn the filter off.
default_level = 2

# name  = file name in RPiList/specials/Blocklisten (or set url = "https://...")
# level = 1, 2 or 3
# os    = only on these systems (linux, windows, android); empty = everywhere
# about = one line for people who read the list

[[list]]
name  = "easylist"
level = 1
about = "Ads and trackers (EasyList)"

