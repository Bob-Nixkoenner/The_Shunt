AutoName: The Shunt
Summary: Give every app its own VPN route
Description: |-
  The Shunt sends each app through its own tunnel (WireGuard, OpenVPN or Tor)
  or directly. This is the F-Droid build: it has no built-in Tor (use Orbot for
  Tor tunnels) and does not update itself. The GitHub and Google Play builds
  bring their own Tor.
