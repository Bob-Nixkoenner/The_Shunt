name: release
# Two ways to release:
#  - publish a release in the GitHub UI (it creates the tag) -> assets are attached
#  - push a v* tag -> a release with assets is created
on:
  release:
    types: [published]
  push:
    tags: ["v*"]
  # a change to this workflow is built once in its pull request: everything
  # but signing and publishing, version v0.0.0-ci
  pull_request:
    paths: [".github/workflows/release.yml"]

# publishing in the UI fires both events for the same tag: build once
concurrency:
  group: release-${{ github.event.release.tag_name || (github.event_name == 'pull_request' && 'v0.0.0-ci') || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write      # build provenance (sigstore)
  attestations: write

jobs:
  android:
    # the Android app (signed with the fixed SHUNT_KEYSTORE key, debug key without the secret); the release job signs its checksum
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the app version comes from `git describe`
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle   # Gradle itself and the app's dependencies
      - name: SDK and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: cache OpenSSL and OpenVPN
        uses: actions/cache@v4
        with:
          path: ~/.cache/shunt-openvpn
          key: openvpn-${{ hashFiles('android/build-openvpn.sh') }}
      - name: build
        env:
          SHUNT_KEYSTORE_B64: ${{ secrets.SHUNT_KEYSTORE_B64 }}
          SHUNT_KEYSTORE_PASSWORD: ${{ secrets.SHUNT_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$SHUNT_KEYSTORE_B64" ]; then
            echo "$SHUNT_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/shunt.p12"
            export SHUNT_KEYSTORE="$RUNNER_TEMP/shunt.p12"
          else
            echo "::warning::no SHUNT_KEYSTORE_B64 secret: APK gets a random debug key (no in-place updates)"
          fi
          android/build-openvpn.sh
          android/fetch-tor.sh
          android/build-core.sh
          # github: the APK (updates itself); play: the bundle for Google Play (no install permission),
          # signed with the same key as upload key (Play re-signs the apps it hands out)
          (cd android && ./gradlew --no-daemon assembleGithubDebug bundlePlayRelease)
          mkdir dist
          cp android/app/build/outputs/apk/github/debug/app-github-debug.apk \
            "dist/shunt-${{ github.event.release.tag_name || (github.event_name == 'pull_request' && 'v0.0.0-ci') || github.ref_name }}-android.apk"
          cp android/app/build/outputs/bundle/playRelease/app-play-release.aab \
            "dist/shunt-${{ github.event.release.tag_name || (github.event_name == 'pull_request' && 'v0.0.0-ci') || github.ref_name }}-play.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            dist/*.apk
            dist/*.aab
          if-no-files-found: error

  windows-setup:
    if: ${{ vars.BUILD_WINDOWS == 'true' }} # Windows assets are off until the repository variable BUILD_WINDOWS is 'true'
    # the installer (Inno Setup) is built on a Windows runner from the files build.sh staged
    needs: windows-files
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: windows-stage
          path: win
      - name: Inno Setup
        shell: pwsh
        env:
          TAG: ${{ github.event.release.tag_name || (github.event_name == 'pull_request' && 'v0.0.0-ci') || github.ref_name }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; if ($LASTEXITCODE) { throw 'choco failed' } }
          New-Item -ItemType Directory -Force out | Out-Null
          & $iscc /Qp "/DAppVersion=$($env:TAG.TrimStart('v'))" "/DSrcDir=$PWD\win" "/DOutDir=$PWD\out" packaging\windows\the-shunt.iss
          if ($LASTEXITCODE) { throw 'ISCC failed' }
          Move-Item out\the-shunt-setup.exe out\the-shunt-windows-amd64-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: out/the-shunt-windows-amd64-setup.exe
          if-no-files-found: error

  windows-files:
    if: ${{ vars.BUILD_WINDOWS == 'true' }}
    # cross-compiled on Linux: service, window, wintun.dll, scripts (+ the ZIP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: SBOM
        # CycloneDX list of the Go modules in the binaries; a failure here must not stop a release
        continue-on-error: true
        env:
          TAG: ${{ github.event.release.tag_name || (github.event_name == 'pull_request' && 'v0.0.0-ci') || github.ref_name }}
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.9.0
          mkdir -p dist
          "$(go env GOPATH)/bin/cyclonedx-gomod" app -json -main cmd/shuntd -output "dist/the-shunt-$TAG.cdx.json"
      - name: build
        env:
          TAG: ${{ github.event.release.tag_name || (github.event_name == 'pull_request' && 'v0.0.0-ci') || github.ref_name }}
        run: VERSION=$TAG DIST=out STAGE_DIR=stage packaging/windows/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-stage
          path: stage
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: out/the-shunt-windows-amd64.zip
          if-no-files-found: error

  linux:
    # Linux binaries, desktop app and .deb packages; runs next to the
    # Android and Windows jobs instead of after them
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # GTK/WebKit for the desktop app: ~180 packages; the runners' Ubuntu
      # mirror took up to 15 minutes for them, the cache brings them back
      - uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-gtk-webkit-${{ runner.os }}-${{ runner.arch }}-v1
      - name: desktop app build dependencies
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get update
          sudo apt-get install -y -o Dir::Cache::archives="$HOME/apt-archives" libgtk-3-dev libwebkit2gtk-4.1-dev
          sudo chown -R "$USER" ~/apt-archives
      - name: build
        env:
          TAG: ${{ github.event.release.tag_name || (github.event_name == 'pull_request' && 'v0.0.0-ci') || github.ref_name }}
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            mkdir -p "build/$arch"
            CGO_ENABLED=0 GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$TAG" \
              -o "build/$arch/" ./cmd/shuntd ./cmd/shunt
            # pluggable transports for Tor bridges (lyrebird: obfs4, snowflake, meek, webtunnel)
            GOARCH=$arch OUT="$PWD/build/$arch" bash packaging/pt/build.sh
            tar -czf "dist/shunt_linux_$arch.tar.gz" -C "build/$arch" shuntd shunt lyrebird
          done
          # desktop app (cgo: GTK + WebKitGTK), amd64
          CGO_ENABLED=1 go build -trimpath -ldflags "-s -w -X main.version=$TAG" -o build/desktop/ ./cmd/shunt-desktop
          tar -czf dist/shunt-desktop_linux_amd64.tar.gz -C build/desktop shunt-desktop
          # Debian packages: the-shunt (amd64, arm64) and the-shunt-desktop (amd64)
          cp build/desktop/shunt-desktop build/amd64/
          for arch in amd64 arm64; do
            VERSION=$TAG ARCH=$arch BIN=build/$arch OUT=dist bash packaging/deb/build.sh
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist
          if-no-files-found: error

  release:
    needs: [android, linux, windows-files, windows-setup]
    # the windows jobs may be skipped (BUILD_WINDOWS), the release still goes out
    if: ${{ !cancelled() && needs.android.result == 'success' && needs.linux.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.windows-files.result) && contains(fromJSON('["success","skipped"]'), needs.windows-setup.result) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-{zip,setup}
          path: dist
          merge-multiple: true
        continue-on-error: true # none when Windows is off
      - name: checksums
        run: |
          # every file of the release, built by the jobs above
          (cd dist && shopt -s nullglob && sha256sum *.tar.gz *.apk *.aab *.zip *.exe *.deb *.cdx.json > SHA256SUMS)
      - name: sign checksums
        if: github.event_name != 'pull_request'
        # install.sh only uses releases whose SHA256SUMS carry this signature
        # (public key: RELEASE_SIGNER in install.sh)
        env:
          SHUNT_RELEASE_KEY: ${{ secrets.SHUNT_RELEASE_KEY }}
        run: |
          [[ -n $SHUNT_RELEASE_KEY ]] || { echo "::error::secret SHUNT_RELEASE_KEY is missing"; exit 1; }
          umask 077
          printf '%s\n' "$SHUNT_RELEASE_KEY" > "$RUNNER_TEMP/release_key"
          ssh-keygen -Y sign -q -f "$RUNNER_TEMP/release_key" -n shunt-release dist/SHA256SUMS
          rm -f "$RUNNER_TEMP/release_key"
          # check against the key install.sh trusts (catches a wrong secret)
          sed -n "s/^RELEASE_SIGNER='\(.*\)'$/\1/p" install.sh > "$RUNNER_TEMP/allowed_signers"
          ssh-keygen -Y verify -f "$RUNNER_TEMP/allowed_signers" -I release@the-shunt -n shunt-release \
            -s dist/SHA256SUMS.sig < dist/SHA256SUMS
      - name: attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.apk
            dist/*.aab
            dist/*.zip
            dist/*.exe
            dist/*.deb
      - name: publish
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || (github.event_name == 'pull_request' && 'v0.0.0-ci') || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            # v1.2.3-rc1 & co. are pre-releases; the notes are the tag's
            # CHANGELOG section (GitHub's generated notes as fallback)
            pre=; [[ $TAG == *-* ]] && pre=--prerelease
            awk -v t="## $TAG" '$0 == t {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
            if [[ -s notes.md ]]; then
              gh release create "$TAG" dist/* $pre --title "$TAG" --notes-file notes.md
            else
              gh release create "$TAG" dist/* $pre --title "$TAG" --generate-notes
            fi
          fi
