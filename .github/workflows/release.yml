name: release
# Two ways to release:
#  - publish a release in the GitHub UI (it creates the tag) -> assets are attached
#  - push a v* tag -> a release with assets is created
on:
  release:
    types: [published]
  push:
    tags: ["v*"]

# publishing in the UI fires both events for the same tag: build once
concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write      # build provenance (sigstore)
  attestations: write

jobs:
  android:
    # the Android app (debug-signed APK); the release job signs its checksum
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the app version comes from `git describe`
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: SDK and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: cache OpenSSL and OpenVPN
        uses: actions/cache@v4
        with:
          path: ~/.cache/shunt-openvpn
          key: openvpn-${{ hashFiles('android/build-openvpn.sh') }}
      - name: build
        run: |
          android/build-openvpn.sh
          android/build-core.sh
          (cd android && ./gradlew --no-daemon assembleDebug)
          mkdir dist
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            "dist/shunt-${{ github.event.release.tag_name || github.ref_name }}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error

  release:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist
      - name: build
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          for arch in amd64 arm64; do
            mkdir -p "build/$arch"
            CGO_ENABLED=0 GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$TAG" \
              -o "build/$arch/" ./cmd/shuntd ./cmd/shunt
            tar -czf "dist/shunt_linux_$arch.tar.gz" -C "build/$arch" shuntd shunt
          done
          # desktop app (cgo: GTK + WebKitGTK), amd64
          sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
          CGO_ENABLED=1 go build -trimpath -ldflags "-s -w -X main.version=$TAG" -o build/desktop/ ./cmd/shunt-desktop
          tar -czf dist/shunt-desktop_linux_amd64.tar.gz -C build/desktop shunt-desktop
          # Windows installer ZIP (service, window, wintun.dll pinned by checksum)
          VERSION=$TAG DIST=dist packaging/windows/build.sh
          (cd dist && sha256sum *.tar.gz *.apk *.zip > SHA256SUMS)
      - name: sign checksums
        # install.sh only uses releases whose SHA256SUMS carry this signature
        # (public key: RELEASE_SIGNER in install.sh)
        env:
          SHUNT_RELEASE_KEY: ${{ secrets.SHUNT_RELEASE_KEY }}
        run: |
          [[ -n $SHUNT_RELEASE_KEY ]] || { echo "::error::secret SHUNT_RELEASE_KEY is missing"; exit 1; }
          umask 077
          printf '%s\n' "$SHUNT_RELEASE_KEY" > "$RUNNER_TEMP/release_key"
          ssh-keygen -Y sign -q -f "$RUNNER_TEMP/release_key" -n shunt-release dist/SHA256SUMS
          rm -f "$RUNNER_TEMP/release_key"
          # check against the key install.sh trusts (catches a wrong secret)
          sed -n "s/^RELEASE_SIGNER='\(.*\)'$/\1/p" install.sh > "$RUNNER_TEMP/allowed_signers"
          ssh-keygen -Y verify -f "$RUNNER_TEMP/allowed_signers" -I release@the-shunt -n shunt-release \
            -s dist/SHA256SUMS.sig < dist/SHA256SUMS
      - name: attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.apk
            dist/*.zip
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            # v1.2.3-rc1 & co. are pre-releases; the notes are the tag's
            # CHANGELOG section (GitHub's generated notes as fallback)
            pre=; [[ $TAG == *-* ]] && pre=--prerelease
            awk -v t="## $TAG" '$0 == t {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
            if [[ -s notes.md ]]; then
              gh release create "$TAG" dist/* $pre --title "$TAG" --notes-file notes.md
            else
              gh release create "$TAG" dist/* $pre --title "$TAG" --generate-notes
            fi
          fi
