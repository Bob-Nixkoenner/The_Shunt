name: ci
on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: desktop app build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...
      - name: fuzz parsers (short)
        run: |
          # a count instead of a duration: a time limit that ends during an
          # input makes go test report "context deadline exceeded" as failure
          go test ./internal/wgconf -run '^$' -fuzz FuzzParse -fuzztime 500000x
          go test ./internal/config -run '^$' -fuzz FuzzParse -fuzztime 500000x
          go test ./internal/argv -run '^$' -fuzz FuzzSplit -fuzztime 500000x
          go test ./internal/appwatch -run '^$' -fuzz FuzzParseExecEvents -fuzztime 500000x
          go test ./internal/ovpnconf -run '^$' -fuzz FuzzParse -fuzztime 500000x
          go test ./internal/sqlitelite -run '^$' -fuzz FuzzRows -fuzztime 500000x
          go test ./internal/sqlitelite -run '^$' -fuzz FuzzFile -fuzztime 20000x
      - name: known vulnerabilities (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: cross-build (portability check)
        run: |
          GOARCH=arm64 go build $(go list ./... | grep -v /cmd/shunt-desktop)
          go build -o /dev/null ./cmd/shunt-desktop
          # everything but the Linux tray builds for other platforms (Backend, see internal/daemon/backend.go)
          GOOS=windows go vet $(go list ./... | grep -v -e /internal/desktopapp -e /cmd/shunt-desktop)
          GOOS=darwin go vet $(go list ./... | grep -v -e /internal/desktopapp -e /cmd/shunt-desktop)

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        driver: [kernel, userspace]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y nftables wireguard-tools iproute2 curl openvpn openssl
      - name: end-to-end in network namespaces
        run: sudo env "PATH=$PATH" "HOME=$HOME" "GOPATH=$(go env GOPATH)" "GOMODCACHE=$(go env GOMODCACHE)" "GOCACHE=$(go env GOCACHE)" SHUNT_DRIVER=${{ matrix.driver }} ./test/integration/run.sh

  # Real install on a systemd host: installer, hardened unit, DNS, uninstall.
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: install
        run: |
          printf '[Interface]\nPrivateKey = %s\nAddress = 10.8.0.2/32\nDNS = 10.8.0.1\n\n[Peer]\nPublicKey = %s\nEndpoint = 192.0.2.1:51820\nAllowedIPs = 0.0.0.0/0, ::/0\n' \
            "$(wg genkey 2>/dev/null || echo yAnz5TF+lXXJte14tji3zlMNq+hd2rYUIgJBgB3fBmk=)" xTIBA5rboUvnH4htodjb6e697QjLERt1NAB4mZqp8Dg= > /tmp/test-vpn.conf
          sudo env "PATH=$PATH" SHUNT_YES=1 SHUNT_WG_CONF=/tmp/test-vpn.conf bash ./install.sh
      - name: verify
        run: |
          set -x
          systemctl is-active shuntd
          sudo shunt status
          getent hosts github.com                                   # DNS through the proxy
          sudo shunt run --via direct -- curl -fsS -o /dev/null https://github.com
          # as an unprivileged member of group shunt (no sudo for the CLI itself)
          sudo -u runner -g shunt shunt run --via direct -- curl -fsS -o /dev/null https://github.com
          sudo -u runner -g shunt shunt status | grep -q 'via:direct'
          # permissions: a member may not change things without polkit/root
          if sudo -u runner -g shunt shunt reload; then echo "expected failure"; exit 1; fi
          sudo shunt reload
          test -f /usr/share/polkit-1/actions/org.theshunt.policy
          # app rules under the hardened unit (no CAP_SYS_PTRACE), for another
          # user's process, via the kernel process connector
          printf '\n[[rule]]\nname = "ci sleeper"\napp = ["sleep"]\nroute = "block"\n' | sudo tee -a /etc/shunt/shunt.toml
          sudo shunt reload
          sudo -u runner sleep 120 &
          sleep 2
          sudo shunt status | tee /tmp/st
          grep -E '^app:ci sleeper +block +[1-9].*sleep' /tmp/st
          if sudo shunt run --via tunnel:test-vpn -- curl -fsS -m 5 -o /dev/null https://github.com; then echo "expected failure"; exit 1; fi # tunnel has no peer: must fail closed
          sudo systemctl restart shuntd && sleep 2 && systemctl is-active shuntd
          sudo journalctl -u shuntd --no-pager | tail -30
      - name: uninstall
        if: always()
        run: |
          sudo bash ./install.sh --uninstall --purge
          if sudo nft list tables | grep -q shunt; then echo "expected failure"; exit 1; fi
          curl -fsS -o /dev/null https://github.com
